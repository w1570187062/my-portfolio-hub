services:
  portfolio:
    build:
      context: .
    container_name: portfolio
    ports:
      - "9989:9989"
    environment:
      - PORT=9989
      - DATA_DIR=/data/portfolio.db
      - ADMIN_USER=admin
      - ADMIN_PASS=asd2335979545
      - TZ=Asia/Shanghai
      # 容器出网必须走 passwall2 显式代理，否则直连会被路由器透明拦截成空 200
      - HTTP_PROXY=http://192.168.31.254:1082
      - HTTPS_PROXY=http://192.168.31.254:1082
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - /mnt/nvme0n1-4/portfolio/data:/data
    restart: unless-stopped
