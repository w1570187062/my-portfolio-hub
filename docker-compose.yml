services:
  portfolio:
    build:
      context: .
    container_name: portfolio
    ports:
      - "9989:9989"
    environment:
      - PORT=9989
      - DATA_DIR=/data/portfolio.db
      - ADMIN_USER=admin
      - ADMIN_PASS=asd2335979545
      - TZ=Asia/Shanghai
      # 注意：不要在此注入 HTTP(S)_PROXY。容器直连经 iStoreOS 路由器透明代理即可正常出网
      # （2026-09-02 复盘：注入显式 HTTPS_PROXY 指向 passwall2:1082 后，真实长文生成请求会
      #  在代理处挂起 ~3 分钟返回空响应 → /api/asset/summary 报 502；去掉后恢复直连，与 13:46 成功请求一致）。
    volumes:
      - /mnt/nvme0n1-4/portfolio/data:/data
    restart: unless-stopped
