<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="up" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4757"/>
      <stop offset="100%" style="stop-color:#ff6b81"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Candle body (bullish) -->
  <rect x="14" y="9" width="4" height="12" rx="1" fill="url(#up)"/>
  <!-- Upper wick -->
  <line x1="16" y1="5" x2="16" y2="9" stroke="#ff6b81" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower wick -->
  <line x1="16" y1="21" x2="16" y2="26" stroke="#ff6b81" stroke-width="2" stroke-linecap="round"/>
  <!-- Previous candle (slightly smaller, left) -->
  <rect x="7" y="13" width="3" height="7" rx="0.5" fill="#2ed573" opacity="0.6"/>
  <line x1="8.5" y1="10" x2="8.5" y2="13" stroke="#2ed573" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="8.5" y1="20" x2="8.5" y2="24" stroke="#2ed573" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Rising arrow -->
  <polygon points="25,18 22,22 24,22 24,28 26,28 26,22 28,22" fill="#ff6b81"/>
</svg>
