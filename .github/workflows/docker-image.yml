name: docker-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # P3-0：UI 一致性校验（设计规范 §5）不通过就不出镜像
      - name: Lint UI (design spec §5 / P3-0)
        run: npm --prefix web run lint:ui

      # 前端构建：CI 用 git checkout 不含 web/dist（被 .gitignore 忽略），
      # 而 Dockerfile 的 fe 阶段对“无预构建 dist”按设计直接报错（优化本地 tar 部署、避免拉 node 镜像）。
      # 故此处用已 setup 的 node 现场构建 web/dist，供后续 docker build 直接 COPY。
      - name: Build frontend (web/dist)
        run: npm --prefix web install && npm --prefix web run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
